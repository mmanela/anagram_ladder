name: Flutter

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.7'

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate GitHub Actions workflows
        uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Run regression tests with coverage
        run: flutter test --no-pub --coverage
      - name: Summarize coverage
        run: |
          awk -F: '
            $1 == "LF" { total += $2 }
            $1 == "LH" { covered += $2 }
            END {
              if (total == 0) {
                print "::error::Coverage report contains no executable lines." > "/dev/stderr"
                exit 1
              }
              printf "### Dart test coverage\n\n%d/%d lines covered (%.1f%%).\n", covered, total, 100 * covered / total
            }
          ' coverage/lcov.info >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: dart-coverage
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 7

  android-and-web:
    needs: checks
    # Do not let existing required checks pass as skipped after a checks failure.
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Require passing checks
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/**/*.gradle*
            android/gradle/wrapper/gradle-wrapper.properties
            pubspec.lock
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Android debug APK
        run: flutter build apk --debug --no-pub
      - name: Upload Android debug APK
        uses: actions/upload-artifact@v7
        with:
          name: android-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
      - name: Build web app
        run: flutter build web --no-pub
      - name: Upload web build
        uses: actions/upload-artifact@v7
        with:
          name: web-build
          path: build/web
          if-no-files-found: error
          retention-days: 7

  ios:
    needs: checks
    if: ${{ !cancelled() }}
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Require passing checks
        env:
          CHECK_RESULT: ${{ needs.checks.result }}
        run: test "$CHECK_RESULT" = success
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Restore locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build iOS simulator app
        run: flutter build ios --simulator --no-pub
      - name: Archive simulator app with executable permissions
        run: tar -czf build/ios-simulator.tar.gz -C build/ios/iphonesimulator Runner.app
      - name: Upload iOS simulator app
        uses: actions/upload-artifact@v7
        with:
          name: ios-simulator-app
          path: build/ios-simulator.tar.gz
          if-no-files-found: error
          retention-days: 7
